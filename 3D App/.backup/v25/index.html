    <!-- Main Content -->
    <main id="main-content">
        <!-- Layer Sidebar -->
        <aside id="layer-panel">
            <div class="panel-header">Layers / Lagen</div>
            <div id="layer-list"></div>
            <button id="btn-add-layer" class="add-layer-btn" title="Add Layer" style="display:none">+</button>
        </aside>

        <!-- Drawing Area -->
        <div id="canvas-container">
            <canvas id="draw-canvas"></canvas>
        </div>

        <!-- 3D Preview -->
        <div id="preview-3d">
            <div class="preview-header">3D</div>
            <canvas id="preview-canvas"></canvas>
        </div>
    </main>

    <!-- Color Palette -->
    <footer id="color-palette"></footer>

    <!-- Restart Confirm Popup -->
    <div id="restart-overlay" class="overlay" hidden>
        <div class="modal">
            <h3>Start over? / Opnieuw beginnen?</h3>
            <p class="modal-hint">This will erase everything. / Dit wist alles.</p>
            <div class="modal-actions">
                <button id="restart-cancel" class="btn-secondary">No / Nee</button>
                <button id="restart-confirm" class="btn-primary">Yes / Ja</button>
            </div>
        </div>
    </div>

    <!-- Send Popup -->
    <div id="send-overlay" class="overlay" hidden>
        <div class="modal">
            <h3>Your Name / Je Naam</h3>
            <input id="send-name" type="text" placeholder="..." autocomplete="off">
            <div class="modal-actions">
                <button id="send-cancel" class="btn-secondary">Cancel / Annuleer</button>
                <button id="send-confirm" class="btn-primary">Send / Versturen</button>
            </div>
            <p id="send-status" class="modal-status"></p>
        </div>
    </div>

    <!-- Settings Panel (hidden by default; revealed via secret tap) -->
    <div id="settings-overlay" class="overlay" hidden>
        <div class="modal">
            <h3>Export Settings</h3>
            <label>Upload Server URL</label>
            <input id="upload-url" type="text" placeholder="http://192.168.1.100:8080">
            <div class="row">
                <button id="settings-test" class="btn-secondary">Test Connection</button>
                <span id="settings-test-result" class="modal-status"></span>
            </div>
            <p class="modal-hint">Run <b>upload-server.py</b> on the target PC, then enter its address here. Leave empty to just download files.</p>
            <div class="modal-actions">
                <button id="settings-cancel" class="btn-secondary">Cancel</button>
                <button id="settings-save" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".vormjr" style="display:none">

    // --- 2D Signed Distance Field at FULL voxel resolution, then downsampled ---
    function signedDist2D(fa,S,z){
        // Build mask at full res
        const m=new Uint8Array(S*S);

                if(x>0)d[i]=Math.min(d[i],d[i-1]+1);if(y>0)d[i]=Math.min(d[i],d[(y-1)*S+x]+1);

    // --- Build 3D SDF field from 2D signed distance ---
    function buildSDF(sd2d,cols,depthFactor){
        const fw=cols+PAD*2, fh=fw, fd=9; // 9 Z slices

        const halfH=2.0; // half-thickness in field Z units
        const zCenter=4; // center Z slice

            const dz=Math.abs(fz-zCenter)-halfH; // distance from slab surface in Z
            for(let fy=0;fy<fh;fy++){
                for(let fx=0;fx<fw;fx++){
                    // Map field coords to column coords
                    const cx=fx-PAD, cy=fy-PAD;
                    let d2d;
                    if(cx<0||cx>=cols||cy<0||cy>=cols) d2d=PAD+1; // outside = positive
                    else d2d=sd2d[cy*cols+cx];
                    // 3D SDF: rounded box union of 2D distance and Z distance
                    // For rounded edges: length(max(vec2(d2d, dz), 0)) + min(max(d2d, dz), 0)
                    const dx=Math.max(d2d,0), dzp=Math.max(dz,0);
                    const outside=Math.sqrt(dx*dx+dzp*dzp);
                    const inside=Math.min(Math.max(d2d,dz),0);
                    sdf[fz*fw*fh+fy*fw+fx]=outside+inside;

        // Light blur on 3D SDF to smooth grid steps
        const blurred=new Float32Array(sdf.length);
        for(let z=0;z<fd;z++)for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
            let sum=0,w=0;
            for(let dz=-1;dz<=1;dz++)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){

                sum+=sdf[nz*fw*fh+ny*fw+nx]*wt;w+=wt;

                const[c0,c1]=EC[e];
                const v0=v[c0],v1=v[c1];
                const t=(Math.abs(v1-v0)>1e-6)?Math.max(0,Math.min(1,(iso-v0)/(v1-v0))):0.5;
                const px=x+CX[c0]+(CX[c1]-CX[c0])*t;
                const py=y+CY[c0]+(CY[c1]-CY[c0])*t;
                const pz=z+CZ[c0]+(CZ[c1]-CZ[c0])*t;
                // Interpolate gradient normals at corners
                const n0=gradN(x+CX[c0],y+CY[c0],z+CZ[c0]);
                const n1=gradN(x+CX[c1],y+CY[c1],z+CZ[c1]);
                const nx=n0[0]*(1-t)+n1[0]*t, ny=n0[1]*(1-t)+n1[1]*t, nz=n0[2]*(1-t)+n1[2]*t;
                const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;

                const idx=verts.length/3;
                // World position: field x,y -> world X,Z; field z -> world Y
                verts.push((px-PAD)*STEP, (pz-4)*LT, (py-PAD)*STEP);
                norms.push(nx/nl, nz/nl, ny/nl); // remap axes
                edgeCache.set(ek,idx);
                evi[e]=idx;
            }
            const r=TT[ci];
            for(let i=0;r[i]!==-1;i+=3){
                tris.push(evi[r[i]],evi[r[i+1]],evi[r[i+2]]);
            }
        }
        return{verts:new Float32Array(verts),norms:new Float32Array(norms),tris:new Int32Array(tris)};
    }

    // --- Bilinear sample helper ---
    function bsamp(map,cols,wx,wz){
        const fx=wx/STEP,fy=wz/STEP;
        const x0=Math.max(0,Math.min(cols-1,Math.floor(fx))),y0=Math.max(0,Math.min(cols-1,Math.floor(fy)));
        const x1=Math.min(cols-1,x0+1),y1=Math.min(cols-1,y0+1);
        const tx=Math.max(0,Math.min(1,fx-x0)),ty=Math.max(0,Math.min(1,fy-y0));
        return map[y0*cols+x0]*(1-tx)*(1-ty)+map[y0*cols+x1]*tx*(1-ty)+map[y1*cols+x0]*(1-tx)*ty+map[y1*cols+x1]*tx*ty;
    }

    function blurHM(s,cols,r){
        const d=new Float32Array(cols*cols);
        for(let y=0;y<cols;y++)for(let x=0;x<cols;x++){let sum=0,cnt=0;
            for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
                const nx=x+dx,ny=y+dy;if(nx<0||nx>=cols||ny<0||ny>=cols)continue;
                const w=1/(1+Math.abs(dx)+Math.abs(dy));sum+=s[ny*cols+nx]*w;cnt+=w;
            }d[y*cols+x]=sum/cnt;}
        return d;
    }

    // --- Main message handler ---
    self.onmessage=function(e){
        const{id,filledArr,layers,S,depthFactor}=e.data;
        const fa=new Uint8Array(filledArr);
        const cols=Math.ceil(S/STEP),stackLT=LT+LG;

        // Compute stacking heights
        const gh=new Float32Array(cols*cols),chm={};
        for(const l of layers){
            const lc=new Uint8Array(cols*cols);
            for(let y=0;y<S;y++)for(let x=0;x<S;x++)
                if(fa[l.z*S*S+y*S+x])lc[Math.floor(y/STEP)*cols+Math.floor(x/STEP)]=1;
            const co=new Float32Array(cols*cols);
            for(let i=0;i<cols*cols;i++)if(lc[i])co[i]=gh[i];
            const sm=blurHM(co,cols,3);
            for(let i=0;i<cols*cols;i++)if(!lc[i])sm[i]=0;
            chm[l.color]=sm;
            // Inflation for stacking
            let im=null;
            if(depthFactor>0){
                const{sd}=signedDist2D(fa,S,l.z);
                im=new Float32Array(cols*cols);
                let mx=0;for(let i=0;i<cols*cols;i++)if(-sd[i]>mx)mx=-sd[i];
                if(mx>0)for(let i=0;i<cols*cols;i++)im[i]=sd[i]<0?Math.sqrt(-sd[i]/mx)*depthFactor:0;
            }
            for(let i=0;i<cols*cols;i++)if(lc[i])gh[i]+=stackLT+(im?im[i]:0);
        }

        const results=[];
        for(const l of layers){
            const{sd,cols:c2}=signedDist2D(fa,S,l.z);
            const sdfData=buildSDF(sd,c2,depthFactor);
            const mesh=marchSDF(sdfData);
            if(mesh.verts.length===0)continue;

            const ch=chm[l.color];
            const depth=depthFactor||0;

            // Depth inflation + stacking offset
            let mnY=1e9,mxY=-1e9;
            for(let i=1;i<mesh.verts.length;i+=3){if(mesh.verts[i]<mnY)mnY=mesh.verts[i];if(mesh.verts[i]>mxY)mxY=mesh.verts[i];}
            const yr=mxY-mnY||1,yc=(mnY+mxY)/2;

            // Normalized distance for inflation
            let mx=0;for(let i=0;i<cols*cols;i++)if(-sd[i]>mx)mx=-sd[i];

            for(let i=0;i<mesh.verts.length;i+=3){
                const wx=mesh.verts[i],wy=mesh.verts[i+1],wz=mesh.verts[i+2];
                // Stacking
                mesh.verts[i+1]+=bsamp(ch,cols,wx,wz);
                // Depth inflation
                if(depth>0&&mx>0){
                    const cx2=Math.floor(wx/STEP),cy2=Math.floor(wz/STEP);
                    const si=Math.max(0,Math.min(cols-1,cy2))*cols+Math.max(0,Math.min(cols-1,cx2));
                    const d2=sd[si]<0?Math.sqrt(-sd[si]/mx):0;
                    mesh.verts[i+1]+=(wy-yc)/(yr/2)*d2*depth;
                }
            }

            // Convert indexed mesh to flat arrays for Three.js (non-indexed)
            const nt=mesh.tris.length/3;
            const fp=new Float32Array(nt*9),fn=new Float32Array(nt*9);
            for(let t=0;t<mesh.tris.length;t++){
                const vi=mesh.tris[t];
                fp[t*3]=mesh.verts[vi*3];fp[t*3+1]=mesh.verts[vi*3+1];fp[t*3+2]=mesh.verts[vi*3+2];
                fn[t*3]=mesh.norms[vi*3];fn[t*3+1]=mesh.norms[vi*3+1];fn[t*3+2]=mesh.norms[vi*3+2];
            }

            results.push({color:l.color,positions:fp.buffer,normals:fn.buffer});
        }
        const tr=[];for(const r of results){tr.push(r.positions,r.normals);}
        self.postMessage({id,results},tr);
    };
    </script>
